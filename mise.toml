[tools]
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate NXPlay.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.test]
description = "Run the NXPlayKit tests"
run = "swift test --package-path Packages/NXPlayKit"

[tasks.build]
description = "Build NX Play.app (Release) into build/"
run = "bin/build"

[tasks.install]
description = "Build NX Play.app and install it into /Applications"
run = "bin/install"

[tasks.app]
description = "Build and open NX Play"
depends = ["build"]
run = "open 'build/Build/Products/Release/NX Play.app'"
